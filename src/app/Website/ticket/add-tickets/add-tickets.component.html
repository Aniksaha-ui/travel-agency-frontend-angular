<section class="w3l-contact-main py-5 mt-5" id="contact">
  <div class="container py-lg-5 py-md-4 py-2">

    <!-- Title -->
    <div class="title-main text-center mx-auto mb-md-5 mb-4">
      <p class="title-style">Tickets</p>


    </div>

    <!-- 🌟 CREATE TICKET FORM BELOW -->
    <div class="row justify-content-center mt-5">
      <div class="col-lg-7 col-md-9">

        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
            <h4 class="mb-0">Create Support Ticket</h4>
          </div>

          <div class="card-body p-4">

            <form [formGroup]="ticketForm" (ngSubmit)="submitTicket()" enctype="multipart/form-data">
              
              <!-- Title -->
              <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" formControlName="title" class="form-control form-control-lg"
                  placeholder="Enter ticket title">
              </div>

              <!-- Description -->
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea formControlName="description" rows="4" class="form-control"
                  placeholder="Write your issue in detail"></textarea>
              </div>

              <!-- Attachment (Drag & Drop) -->
              <div class="mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted">Attachment</label>
                
                <div class="file-upload-wrapper" *ngIf="!attachmentFile">
                  <div class="file-dropzone" [class.dragover]="isDragging">
                    <input 
                      type="file" 
                      (change)="onFileChange($event)"
                      (dragover)="onDragOver($event)"
                      (dragleave)="onDragLeave($event)"
                      (drop)="onDrop($event)"
                      title=" " 
                    />
                    <div class="upload-icon">
                      <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">
                      <h5>Drag & Drop files here</h5>
                      <p>or click to browse</p>
                    </div>
                  </div>
                </div>

                <!-- Preview Container -->
                <div class="file-preview-container" *ngIf="attachmentFile">
                  <div class="preview-content">
                    <!-- Image Preview -->
                    <img *ngIf="fileType === 'image' && previewUrl" [src]="previewUrl" class="image-preview" />
                    
                    <!-- File Icon Preview -->
                    <div *ngIf="fileType === 'other'" class="file-icon-preview">
                      <i class="far fa-file-alt"></i>
                    </div>

                    <div class="file-info">
                      <span class="file-name">{{ attachmentFile.name }}</span>
                      <span class="file-size">{{ fileSize }}</span>
                    </div>
                  </div>
                  
                  <button type="button" class="btn-remove-file" (click)="removeFile()">
                    <i class="fas fa-times"></i>
                  </button>
                </div>
              </div>

              <!-- Remarks -->
              <div class="mb-3">
                <label class="form-label">Remarks</label>
                <input type="text" formControlName="remarks" class="form-control"
                  placeholder="Notes or additional info">
              </div>

              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  Submit Ticket
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>

  </div>
</section>
