<section class="blog-detail-section py-5 mt-5">
    <div class="container">
        <div *ngIf="loading" class="row justify-content-center">
            <div class="col-lg-8">
                <app-skeleton [height]="'400px'" [width]="'100%'" class="mb-4"></app-skeleton>
                <app-skeleton [height]="'30px'" [width]="'70%'" class="mb-3"></app-skeleton>
                <app-skeleton [height]="'20px'" [width]="'50%'" class="mb-5"></app-skeleton>
                <app-skeleton [height]="'150px'" [width]="'100%'"></app-skeleton>
            </div>
        </div>

        <article *ngIf="!loading && blog" class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Post Header -->
                <header class="post-header text-center mb-5">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-center mb-4">
                            <li class="breadcrumb-item"><a routerLink="/blogs">Blog</a></li>
                            <li class="breadcrumb-item active" aria-current="page">{{blog.title}}</li>
                        </ol>
                    </nav>
                    <h1 class="display-4 fw-bold mb-4">{{blog.title}}</h1>
                    <div class="post-meta d-flex justify-content-center align-items-center gap-3">
                        <div class="author-info d-flex align-items-center">
                            <img src="https://ui-avatars.com/api/?name={{blog.author}}&background=random"
                                class="author-img me-2" alt="author">
                            <span class="fw-bold">{{blog.author}}</span>
                        </div>
                        <span class="text-muted">•</span>
                        <span class="text-muted">{{blog.publishDate | date:'fullDate'}}</span>
                    </div>
                </header>

                <!-- Featured Image -->
                <div class="featured-image-wrapper mb-5 shadow-lg rounded-4 overflow-hidden">
                    <img [src]="blog.coverImage" class="img-fluid w-100" [alt]="blog.title">
                </div>

                <!-- Post Content -->
                <div class="post-body">
                    <div class="content-wrapper" [innerHTML]="safeContent"></div>
                </div>

                <!-- Post Footer -->
                <footer class="post-footer mt-5 pt-5 border-top">
                    <div class="share-box d-flex align-items-center justify-content-between flex-wrap gap-3">
                        <div class="tags">
                            <span class="badge bg-light text-dark me-2">#Travel</span>
                            <span class="badge bg-light text-dark me-2">#Adventure</span>
                            <span class="badge bg-light text-dark">#Experience</span>
                        </div>
                        <div class="social-share">
                            <span class="me-3 fw-bold">Share this story:</span>
                            <div class="btn-group">
                                <button class="btn btn-outline-primary btn-sm rounded-circle mx-1"><i
                                        class="fab fa-facebook-f"></i></button>
                                <button class="btn btn-outline-info btn-sm rounded-circle mx-1"><i
                                        class="fab fa-twitter"></i></button>
                                <button class="btn btn-outline-danger btn-sm rounded-circle mx-1"><i
                                        class="fab fa-pinterest"></i></button>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </article>

        <div *ngIf="!loading && !blog" class="text-center py-5">
            <h2>Oops! Blog post not found.</h2>
            <button class="btn btn-primary mt-3" routerLink="/blogs">Back to Blog</button>
        </div>
    </div>
</section>
