<section class="w3l-index5 pb-5 pt-4">
  <div class="mt-5 container-fluid py-lg-5 py-md-4 py-2">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="title-main text-center mx-auto mb-md-5 mb-4">
            <h3 class="title-style">Details of {{ tourInfo.trip_name }}</h3>
          </div>
        </div>
        <div class="col-lg-12 d-flex align-item-center justify-content-center">
          <img class="img-fluid w-75" src="{{ tourInfo.image }}" alt="" />
        </div>
        <div class="col-lg-12">
          <div class="row g-4 mt-5">
            <div class="card col-lg-3 border-0">
              <h6 class="title-style">starting Date</h6>
              <p class="title-style">{{ tourInfo.departure_time }}</p>
            </div>
            <div class="card col-lg-3 border-0">
              <h6 class="title-style">End Date</h6>
              <p class="title-style">{{ tourInfo.arrival_time }}</p>
            </div>
            <div class="card col-lg-3 border-0">
              <h6 class="title-style">Price</h6>
              <p class="title-style">{{ tourInfo.price }}</p>
            </div>
            <div class="card col-lg-3 border-0">
              <h6 class="title-style">Status</h6>
              <p class="title-style">{{ tourInfo.status }}</p>
            </div>
          </div>
        </div>

        <div
          class="col-lg-12 d-flex align-items-center justify-content-center mt-4"
        >
          <p style="color: rgb(12, 11, 11)" class="title-style">
            {{ tourInfo.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
