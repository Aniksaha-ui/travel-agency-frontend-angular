<section class="w3l-index5 pb-5 pt-4">
  <div class="container-fluid py-lg-5 py-md-4 py-2 mt-5">
    <div class="container">
      <!-- Title Section -->
      <div class="row">
        <div class="col-lg-12">
          <div class="title-main text-center mx-auto mb-md-5 mb-4">
            <h3 class="title-style text-primary">
              Details of {{ tourInfo.trip_name }}
            </h3>
          </div>
        </div>
      </div>

      <!-- Image Section with full width -->
      <div class="row justify-content-center">
        <div class="col-lg-12">
          <img
            class="img-fluid w-100 rounded shadow"
            src="{{ tourInfo.image }}"
            alt="Tour Image"
          />
        </div>
      </div>

      <!-- Tour Details Section -->
      <div class="row g-4 mt-5">
        <!-- Starting Date -->
        <div class="col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm text-center p-3">
            <div class="card-body">
              <h6 class="title-style text-primary">Starting Date</h6>
              <p class="text-dark">{{ tourInfo.departure_time }}</p>
            </div>
          </div>
        </div>

        <!-- End Date -->
        <div class="col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm text-center p-3">
            <div class="card-body">
              <h6 class="title-style text-primary">End Date</h6>
              <p class="text-dark">{{ tourInfo.arrival_time }}</p>
            </div>
          </div>
        </div>

        <!-- Price -->
        <div class="col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm text-center p-3">
            <div class="card-body">
              <h6 class="title-style text-primary">Price</h6>
              <p class="text-dark">{{ tourInfo.price | currency }}</p>
            </div>
          </div>
        </div>

        <!-- Status -->
        <div class="col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm text-center p-3">
            <div class="card-body">
              <h6 class="title-style text-primary">Status</h6>
              <p class="text-dark">{{ tourInfo.status }}</p>
            </div>
          </div>
        </div>

        <!-- Login Section for Booking -->
        <div *ngIf="!isLoggedIn" class="col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm text-center p-3">
            <div class="card-body">
              <h6 class="title-style text-primary">Book Now</h6>
              <p class="text-dark">Login to book your tour</p>
            </div>
          </div>
        </div>

        <!-- Book Now Button -->
        <div *ngIf="isLoggedIn" class="col-lg-4 col-md-6">
          <div class="card border-0 shadow-sm text-center p-3">
            <div class="card-body">
              <button class="btn btn-primary" (click)="bookNow(tourInfo.id)">
                Book Now
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Description Section -->
      <div class="row mt-4 justify-content-center">
        <div class="col-lg-8 text-center">
          <p class="text-muted" style="font-size: 1.1rem; line-height: 1.7">
            {{ tourInfo.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
