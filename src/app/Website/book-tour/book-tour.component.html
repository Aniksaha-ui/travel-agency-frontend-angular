<section class="booking-section">
  <div class="container">
    <h2 class="page-title">Complete Your Booking</h2>

    <div class="row" *ngIf="seatLayout.length !== 0">
      <!-- Bus Layout Section -->
      <div class="col-lg-7 mb-4">
        <div class="bus-container">
          <div class="bus-front">
            <span class="driver-area">Driver's Seat</span>
          </div>

          <div class="seat-grid">
            <button *ngFor="let seat of seatLayout" class="seat-item" (click)="toggleSeat(seat)" [ngClass]="{
                'seat-available': +seat.is_available === 1 && !isSeatSelected(seat),
                'seat-selected': isSeatSelected(seat),
                'seat-booked': +seat.is_available === 0
              }" [disabled]="+seat.is_available === 0">
              {{ seat.seat_number }}
            </button>
          </div>

          <div class="seat-legend">
            <div class="legend-item">
              <div class="legend-marker marker-available"></div>
              <span>Available</span>
            </div>
            <div class="legend-item">
              <div class="legend-marker marker-selected"></div>
              <span>Selected</span>
            </div>
            <div class="legend-item">
              <div class="legend-marker marker-booked"></div>
              <span>Booked</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Booking Summary & Payment Section -->
      <div class="col-lg-5">
        <div class="summary-card">
          <div class="card-title">
            <span>Booking Summary</span>
          </div>

          <div class="selected-seats-container">
            <span *ngIf="selectedSeats.length === 0" class="text-muted small">Select seats to proceed</span>
            <div *ngFor="let seat of selectedSeats" class="selected-seat-tag">
              Seat {{ seat.seat_number }}
              <span class="remove-icon" (click)="toggleSeat(seat)">×</span>
            </div>
          </div>

          <div class="amount-box">
            <span class="amount-label">Total Payable Amount</span>
            <span class="amount-value">BDT {{ calculateTotalAmount() }}</span>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Hidden Amount Field Update -->
            <input type="hidden" formControlName="amount" [value]="calculateTotalAmount()" />

            <!-- Payment Method -->
            <div class="form-group">
              <label for="payment_method" class="form-label">Payment Method</label>
              <select class="form-select" formControlName="payment_method" id="payment_method">
                <option value="" disabled selected>Select Payment Method</option>
                <option value="bkash">Bkash</option>
                <option value="nagad">Nagad</option>
                <option value="card">Card</option>
              </select>
            </div>

            <!-- Card Number -->
            <div class="form-group" *ngIf="loginForm.value.payment_method === 'card'">
              <label for="card" class="form-label">Card Number</label>
              <input type="text" class="form-control" formControlName="card" id="card"
                placeholder="Enter card number" />
            </div>

            <!-- Nagad Number -->
            <div class="form-group" *ngIf="loginForm.value.payment_method === 'nagad'">
              <label for="nagad" class="form-label">Nagad Number</label>
              <input type="text" class="form-control" formControlName="nagad" id="nagad"
                placeholder="Enter Nagad number" />
            </div>

            <!-- Bkash Number -->
            <div class="form-group" *ngIf="loginForm.value.payment_method === 'bkash'">
              <label for="bkash" class="form-label">Bkash Number</label>
              <input type="text" class="form-control" formControlName="bkash" id="bkash"
                placeholder="Enter Bkash number" />
            </div>

            <div class="divider"></div>

            <button type="submit" class="btn-confirm" [disabled]="selectedSeats.length === 0 || loginForm.invalid">
              Confirm Booking
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="seatLayout.length === 0" class="empty-state">
      <h3>Seats are not assigned now. Please try again later.</h3>
    </div>
  </div>
</section>
